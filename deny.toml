# Dependency licenses, checked in CI with `cargo deny check licenses`.
#
# Only permissive licenses are allowed. Trilobit licenses afwd under the AGPL, but keeps
# the right to offer it under other terms, including closed source. A dependency under
# a copyleft license (GPL, AGPL, LGPL, MPL, ...) would take that right away, so it needs
# a deliberate decision before it is added here.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# afwd itself is AGPL-3.0-only and not published, so it is not checked against the list.
private = { ignore = true }
