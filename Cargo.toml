[package]
name = "afwd"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
hickory-resolver = "0.25"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }