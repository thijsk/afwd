name: Build container

on:
  push:
    branches:
    - main
    tags:
    - "v*"
  pull_request:
    branches:
    - main
  workflow_dispatch:


permissions:
  contents: read

jobs:
  test:
    name: Test Rust application
    runs-on: ubuntu-latest
    steps:
    - name: Check out source
      uses: actions/checkout@v5

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Check formatting
      run: cargo fmt --all --check

    - name: Run Clippy
      run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

    - name: Run tests
      run: cargo test --locked --workspace --all-targets

  licenses:
    name: Check dependency licenses
    runs-on: ubuntu-latest
    steps:
    - name: Check out source
      uses: actions/checkout@v5

    - name: Run cargo deny
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check licenses

  image:
    name: Build and publish ${{ matrix.target }} image
    needs: [test, licenses]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [proxy, edge, site]
    permissions:
      contents: read
      packages: write
      # Keyless signing: GitHub vouches for the workflow and branch that built the image.
      # The server only runs images signed by this workflow on main.
      id-token: write
    steps:
    - name: Check out source
      uses: actions/checkout@v5

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract image metadata
      id: metadata
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha

    - name: Build and publish container
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        target: ${{ matrix.target }}
        push: ${{ github.event_name == 'push' }}
        tags: ${{ steps.metadata.outputs.tags }}
        labels: ${{ steps.metadata.outputs.labels }}
        cache-from: type=gha,scope=${{ matrix.target }}
        cache-to: type=gha,mode=max,scope=${{ matrix.target }}
        provenance: mode=max
        sbom: true

    - name: Install cosign
      if: github.event_name == 'push'
      uses: sigstore/cosign-installer@v3

    - name: Sign the published image
      if: github.event_name == 'push'
      env:
        IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.target }}@${{ steps.build.outputs.digest }}
      run: cosign sign --yes "$IMAGE"
