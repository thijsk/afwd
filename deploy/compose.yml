# Runs afwd as three containers:
#
#   proxy  Caddy: HTTPS certificates, and routing by host
#   edge   the forwarding service, for every host except the help domain
#   site   the help site (afwd.nl)
#
# Build from source and start:   docker compose -f deploy/compose.yml up --build -d
# Use the published images:      docker compose -f deploy/compose.yml pull
#                                docker compose -f deploy/compose.yml up -d
#
# Settings are read from deploy/.env. See deploy/.env.example.

name: afwd

x-service: &service
  restart: unless-stopped
  # No container needs extra privileges: Caddy listens on unprivileged ports.
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  env_file:
    - path: .env
      required: false

services:
  proxy:
    <<: *service
    build:
      context: ..
      target: proxy
    image: ${AFWD_IMAGE:-ghcr.io/thijsk/afwd}-proxy:${AFWD_TAG:-main}
    ports:
      - "${AFWD_HTTP_PORT:-80}:8080"
      - "${AFWD_HTTPS_PORT:-443}:8443"
    volumes:
      - afwd-data:/data
      - afwd-config:/config
    depends_on:
      - edge
      - site

  edge:
    <<: *service
    build:
      context: ..
      target: edge
    image: ${AFWD_IMAGE:-ghcr.io/thijsk/afwd}-edge:${AFWD_TAG:-main}
    # The service runs as process 1; init passes on stop signals so it stops promptly.
    init: true
    volumes:
      - afwd-stats:/stats

  site:
    <<: *service
    build:
      context: ..
      target: site
    image: ${AFWD_IMAGE:-ghcr.io/thijsk/afwd}-site:${AFWD_TAG:-main}
    init: true
    volumes:
      - afwd-stats:/stats

# Compose names these afwd_afwd-data, afwd_afwd-config and afwd_afwd-stats: the volumes of
# the earlier single-container compose project, so certificates and statistics carry over.
volumes:
  afwd-data:
  afwd-config:
  afwd-stats:
