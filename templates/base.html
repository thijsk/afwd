<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AFWD{% endblock %}</title>
  <meta name="description" content="{% block description %}Free web forwarding with one DNS record. No account, HTTPS included.{% endblock %}">
  <meta name="theme-color" content="#0d3b66">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d23348'/%3E%3Cpath d='M8 16h14m-5-6 6 6-6 6' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
{% include "style.css" %}
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="AFWD home">
        {% include "logo.svg" %}
        <span>afwd</span>
      </a>
      <nav aria-label="Main">
        <a href="/docs">Docs</a>
        <a href="/stats">Statistics</a>
        <a href="/domains">Domains</a>
      </nav>
    </div>
  </header>
{% block main %}
  <main class="wrap page">
{% block content %}{% endblock %}
  </main>
{% endblock %}
  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p><strong>afwd</strong> · Free web forwarding by <a href="https://www.trilobit.nl/">Trilobit BV</a></p>
      <p><a href="/docs">Docs</a> · <a href="/stats">Statistics</a> · <a href="/domains">Most active domains</a></p>
    </div>
  </footer>
</body>
</html>
